<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Автоаукцион — Админка</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="hifi-shared.jsx"></script>
<script type="text/babel" src="admin-app.jsx"></script>
<script type="text/babel" src="admin-forms.jsx"></script>

<script type="text/babel">
const TITLES = { dash: 'Дашборд', lots: 'Лоты', auctions: 'Торги', deals: 'Сделки', users: 'Пользователи', settings: 'Параметры аукциона' };

function AdminApp() {
  const [page, setPage] = React.useState('dash');
  const [overlay, setOverlay] = React.useState(null); // {type, lot?/user?/deal?}

  const go = (p) => { setOverlay(null); setPage(p); };
  const add = () => setOverlay({ type: 'add' });
  const edit = (lot) => setOverlay({ type: 'edit', lot });
  const control = (lot) => setOverlay({ type: 'control', lot });
  const addUser = () => setOverlay({ type: 'adduser' });
  const openUser = (user) => setOverlay({ type: 'edituser', user });
  const openDeal = (deal) => setOverlay({ type: 'deal', deal });
  const relist = (lot) => setOverlay({ type: 'relist', lot });
  const back = () => setOverlay(null);

  let title = TITLES[page];
  let body;
  if (overlay && overlay.type === 'add') { body = <AddLot onBack={back} />; }
  else if (overlay && overlay.type === 'edit') { body = <AddLot lot={overlay.lot} onBack={back} />; }
  else if (overlay && overlay.type === 'relist') { body = <AddLot lot={overlay.lot} relist={true} onBack={back} />; }
  else if (overlay && overlay.type === 'control') { body = <AuctionControl lot={overlay.lot} onBack={back} />; }
  else if (overlay && overlay.type === 'adduser') { body = <AddUser onBack={back} />; }
  else if (overlay && overlay.type === 'edituser') { body = <AddUser user={overlay.user} onBack={back} />; }
  else if (overlay && overlay.type === 'deal') { body = <DealDetail deal={overlay.deal} onBack={back} />; }
  else if (page === 'dash') body = <Dashboard onAdd={add} openLot={control} openDeal={openDeal} />;
  else if (page === 'lots') body = <LotsTable onAdd={add} onEdit={edit} openLot={control} onRelist={relist} />;
  else if (page === 'auctions') body = <AuctionsBoard openLot={control} onAdd={add} />;
  else if (page === 'deals') body = <Deals onOpen={openDeal} />;
  else if (page === 'users') body = <UsersTable onAdd={addUser} onOpen={openUser} />;
  else body = <Settings />;

  const showTopbar = !overlay;

  return (
    <div className="admin">
      <Sidebar page={page} setPage={go} />
      <div className="main">
        {showTopbar && (
          <div className="topbar">
            <h1>{title}</h1>
            <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
              <span className="num" style={{ fontSize: 13, color: 'var(--faint)' }}>5 июня 2026 · 14:20</span>
            </div>
          </div>
        )}
        <React.Fragment key={(overlay ? overlay.type + (overlay.lot ? overlay.lot.id : '') : page)}>
          {body}
        </React.Fragment>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
</script>
</body>
</html>
