# Продакшен: весь стек на одном сервере.
#   cp .env.prod.example .env   →  заполнить  →  docker compose -f docker-compose.prod.yml up -d --build
name: hermes

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: hermes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?задайте S3_ACCESS_KEY в .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY в .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb -p local/lots &&
      mc anonymous set download local/lots
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://hermes:${POSTGRES_PASSWORD}@postgres:5432/hermes
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      # Публичный адрес API за прокси — для точного redirect_uri Яндекс OAuth
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://${DOMAIN}/api}
      WEB_ORIGIN: https://${DOMAIN:?задайте DOMAIN в .env}
      ADMIN_ORIGIN: https://admin.${DOMAIN}
      # COOKIE_DOMAIN влияет ТОЛЬКО на покупательские куки (Яндекс): общий домен нужен,
      # т.к. OAuth-callback приходит на основной домен. Staff-куки (логин/пароль в админке)
      # выдаются host-only на admin.DOMAIN и сюда не относятся — сессии не смешиваются.
      COOKIE_DOMAIN: .${DOMAIN}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: lots
      S3_PUBLIC_URL: https://${DOMAIN}/s3/lots
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@${DOMAIN}}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-441931183}
      TELEGRAM_BOT_POLLING: ${TELEGRAM_BOT_POLLING:-1}

  proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxy
    restart: unless-stopped
    depends_on:
      - api
      - uptime-kuma
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?задайте ACME_EMAIL в .env}
    volumes:
      - caddydata:/data
      - caddyconfig:/config

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptimekuma:/app/data

  netdata:
    image: netdata/netdata:stable
    restart: unless-stopped
    hostname: ${DOMAIN}
    ports:
      # Только локально на сервере. Открывать через SSH tunnel:
      # ssh -L 19999:127.0.0.1:19999 root@SERVER
      - "127.0.0.1:19999:19999"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
  uptimekuma:
  netdataconfig:
  netdatalib:
  netdatacache:
